name: Windows精简发行包验证
on:
  push:
    branches: [slim]
    paths: [windows/release-check.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装资源检查依赖
        run: python -m pip install -r android/requirements-assets.txt
      - name: 下载待发布发行包并核对散列
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib,json,subprocess
          from pathlib import Path
          request=json.loads(Path('windows/release-check.json').read_text())
          release=json.loads(subprocess.check_output(['gh','api','repos/hophenby2/bossrush/releases/'+str(request['release_id'])]))
          asset=next(x for x in release['assets'] if x['name']==request['asset'])
          with open('windows-release.zip','wb') as file:
              subprocess.run(['gh','api','-H','Accept: application/octet-stream',asset['url']],stdout=file,check=True)
          assert hashlib.sha256(Path('windows-release.zip').read_bytes()).hexdigest()==request['sha256']
      - name: 检查资源与包体完整性
        run: python tools/check_windows_package.py windows-release.zip --output windows-package-result.json
      - name: 真实Windows引擎验证
        run: python tools/run_windows_release.py windows-release.zip --output windows-native
      - name: 保存验证记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-slim-verification
          path: |
            windows-package-result.json
            windows-native/native-result.json
            windows-native/**/*.log
            windows-native/**/native-result.json
